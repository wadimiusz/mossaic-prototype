[project]
name = "mossaic-prototype"
version = "0.1.0"
description = "Evaluator harness for evolving substrate-independent interpretability methods"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "numpy",
    "openevolve",
    "python-dotenv",
    "scipy",
    "torch",
    "pyro-ppl",
    "datasets",
]

[dependency-groups]
dev = ["pre-commit"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

