max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 4
diff_based_evolution: false

llm:
  # Switch provider here — no .env changes needed:
  # api_base: "https://api.openai.com/v1"      # direct OpenAI (Responses API)
  api_base: "https://openrouter.ai/api/v1"      # OpenRouter (Chat Completions API)
  models:
    - name: "anthropic/claude-sonnet-4"
      weight: 4.0
    - name: "anthropic/claude-opus-4.6"
      weight: 1.0
  max_tokens: 16384
  timeout: 1800

database:
  population_size: 50
  num_islands: 3
  migration_interval: 10
  feature_dimensions:
    - "score"

evaluator:
  timeout: 300
  max_retries: 3

prompt:
  system_message: |-
    You are an expert in neural network interpretability. Your goal is to improve
    the `build_dist` function so it accurately models the distribution of a
    transformer's internal representations.

    ## Overview
    Small transformers (2 layers, 2 heads, d_model=64, dim_ff=128) were trained on
    various classification tasks. Your function is called on many different models.
    The SAME code must work for all of them — you do not know what task each model
    was trained on.

    Given the model weights and config, you must return a distribution q(y) that
    models the distribution of the 64-dim residual stream vectors at the output.

    ## Function signature

        def build_dist(model_weights, model_config) -> dict

    ## Parameters
    - model_weights: dict of numpy arrays — the transformer's weights.
      Always present:
        token_emb.weight          (V, 64)   — token embeddings (V = vocab size)
        pos_emb.weight            (L, 64)   — positional embeddings (L = max seq length)
        encoder.layers.{i}.self_attn.in_proj_weight  (192, 64) — Q/K/V packed
        encoder.layers.{i}.self_attn.in_proj_bias    (192,)
        encoder.layers.{i}.self_attn.out_proj.weight  (64, 64)
        encoder.layers.{i}.self_attn.out_proj.bias    (64,)
        encoder.layers.{i}.linear1.weight  (128, 64)  — FFN up-projection
        encoder.layers.{i}.linear1.bias    (128,)
        encoder.layers.{i}.linear2.weight  (64, 128)  — FFN down-projection
        encoder.layers.{i}.linear2.bias    (64,)
        encoder.layers.{i}.norm1.weight    (64,)      — LayerNorm
        encoder.layers.{i}.norm1.bias      (64,)
        encoder.layers.{i}.norm2.weight    (64,)
        encoder.layers.{i}.norm2.bias      (64,)
      where i = 0, 1 (2 transformer layers).
      May also include classification heads (head.weight, head.bias, head_bias,
      depth_head.weight, depth_head.bias) — these vary by model and reveal
      which directions in residual space the model uses for its output.

    - model_config: dict with architectural parameters. Always includes d_model (64),
      nhead (2), num_layers (2), dim_ff (128), seed. May include other task-specific
      keys (vocab sizes, sequence lengths, etc.).

    ## Architecture
    All models: 2 layers, 2 heads, d_model=64, dim_ff=128, ReLU activation in FFN,
    LayerNorm, residual connections. Input: token_emb + pos_emb → encoder →
    residual stream at last valid position. You model the distribution of these
    64-dim vectors.

    ## What to return
    A DistGraph v1 dict:
        {"format": "mossaic.distgraph", "version": 1, "root": "<node_id>", "nodes": [...]}

    Node kinds:
    - const: {"id": "x", "kind": "const", "value": [1.0, 2.0]}
    - tensor_op: {"id": "x", "kind": "tensor_op", "op": "softplus",
        "args": [{"$ref": "raw"}], "kwargs": {}}
      Allowed ops: add, sub, mul, div, neg, matmul, einsum, transpose, reshape,
        squeeze, unsqueeze, sum, mean, norm, square, sqrt, stack, cat, diag_embed,
        exp, log, softplus, sigmoid, tanh, relu, clamp, maximum, minimum, where.
    - call: {"id": "d", "kind": "call", "callable": "torch.distributions.Normal",
        "returns": "distribution", "kwargs": {"loc": {"$ref": "mu"}, "scale": {"$ref": "s"}}}
      Allowed: torch.distributions.*, pyro.distributions.*

    Use {"$ref": "node_id"} to reference earlier nodes.
    Root must be a Distribution with event_shape == (64,). log_prob must not produce NaN/Inf.

    ### Available distributions
    torch: Normal, MultivariateNormal, LowRankMultivariateNormal, Cauchy, StudentT,
      Laplace, VonMises, Independent, MixtureSameFamily, TransformedDistribution, Categorical
    pyro: MixtureOfDiagNormals, ProjectedNormal, MultivariateStudentT
    transforms: AffineTransform, ExpTransform, SigmoidTransform, TanhTransform

    ## Scoring
    Score = mean improvement over a fitted diagonal Gaussian baseline, across models.
    Higher is better. You may reimplement the forward pass in numpy using the weights.
    scipy.special.softmax is available.

    ## Strategy
    - Examine what weight keys are present and their shapes to understand the model.
    - Classification heads (if present) reveal the directions the model uses for output.
    - The token embedding matrix encodes the model's vocabulary — its statistics
      (mean, covariance, SVD) contain information about the representation space.
    - A mixture of Gaussians with per-class means and covariance typically captures
      more structure than a single Gaussian.
    - LayerNorm parameters indicate the scale and center of representations.

  num_top_programs: 4
  num_diverse_programs: 3

log_level: "DEBUG"
